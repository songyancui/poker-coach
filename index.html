  return quizHTML()+probHTML()+tipsHTML()+(withChart?tabChart():'')+`<div class="sec"><h4>📘 知识要点</h4>${L.map(([t,p])=>`<div class="lesson"><b>${t}</b><p>${p}</p></div>`).join('')}</div>`;
}

// ================= 问教练（走大模型，经本地 server.py 转发） =================
const CHAT={msgs:LS.get('pk_chat',[]).slice(-20),busy:false,open:LS.get('pk_chat_open',true)};
const strip=h=>String(h).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ');
const ct=c=>rn(cr(c))+SUITS[cs(c)];
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function chatContext(){
  const L=[];
  L.push('【应用设定】6人桌无限注德州，盲注1/2，每人起始200（100BB）。玩家是“你”。对手是电脑机器人，名字即风格：紧弱/松弱/紧凶/松凶/平衡。');
  L.push('【工具如何算数】胜率=蒙特卡洛模拟（对每个对手按其风格×位置的起手牌范围抽牌，范围随动作收窄；翻后对手若主动下注，则未击中公共牌的牌只以较低概率保留）。起手牌排名用 Chen 公式。期望值是简化模型：只算到本街，被跟注时按更强的跟注范围折算胜率，弃牌率按对手风格和下注大小估计。这些是近似，不是GTO解算器。');
  if(TAB==='review'&&HIST[REVIEW_SEL]){
    const r=HIST[REVIEW_SEL];
    L.push(`【用户正在复盘第${r.no}手】位置${r.pos}，底牌${r.hole.map(ct).join(' ')}，最终公共牌${r.board.map(ct).join(' ')||'无'}，结果${r.net}筹码，决策得分${r.score==null?'无':Math.round(r.score*100)}。`);
    r.tl.forEach(s=>{L.push(`-- ${STREET[s.s]} ${s.board.map(ct).join(' ')} 底池${s.pot}`);s.acts.forEach(a=>{
      if(a.h&&a.d!=null&&r.decisions[a.d]){const d=r.decisions[a.d];L.push(`  你：${d.act}｜评分${GT[d.g]}｜教练建议:${d.rec}｜决策时估算胜率${pf(d.eq)}${d.toCall?`(需要${pf(d.req)})`:''}${d.actual!=null?`｜对手真实底牌下胜率${pf(d.actual)}`:''}｜点评:${strip(d.note)}${d.opts?`｜各选项期望:${d.opts.map(o=>o.l+' '+fmt(o.ev)).join('，')}`:''}｜教练理由:${d.why.map(strip).join(' ')}`);}
      else L.push(`  ${a.n} ${a.l}`);});});
    if(r.sd) L.push('摊牌：'+r.sd.map(p=>`${p.me?'你':p.n} ${p.hole.map(ct).join(' ')} ${p.hn}`).join('；'));
    if(r.fd.length) L.push('弃牌者底牌：'+r.fd.map(p=>`${p.n} ${p.hole.map(ct).join(' ')}`).join('；'));
  }else if(G.handNo){
    const me=P[0];
    L.push(`【当前牌局·第${G.handNo}手】阶段${STREET[G.street]}，你的位置${POS_CN[posOf(0)]}(${posOf(0)})，底牌${me.hole.map(ct).join(' ')}，公共牌${G.board.map(ct).join(' ')||'无'}，底池${potTotal()}，你的筹码${me.stack}${G.over?'，本手已结束':''}。`);
    L.push('对手：'+P.filter(q=>q.style).map(q=>`${q.name}(${q.style.tag}，${POS_CN[posOf(P.indexOf(q))]}，筹码${q.stack}${q.folded?'，已弃牌':''}${q.range<1?`，翻前范围约前${pf(q.range)} ${rangeText(q.range)}`:''}${q.last?`，最近动作:${q.last}`:''})`).join('；'));
    if(G.over&&G.result&&G.result.type==='showdown') L.push('摊牌：'+G.result.cont.map(p=>`${p.name} ${p.hole.map(ct).join(' ')} ${handName(p.score)}`).join('；'));
    L.push('行动记录：'+G.log.slice(-18).map(strip).join(' | '));
    const A=G.analysis;
    if(A&&!G.over){
      L.push('【教练面板当前显示】建议：'+recText(A));
      L.push('理由：'+A.why.map(strip).join(' '));
      L.push('局面数据：'+A.lines.map(([k,v])=>k+'：'+strip(v)).join('；'));
      if(A.opts) L.push('各选项期望值：'+A.opts.map(o=>`${o.label} ${fmt(o.ev)}${o.fe!=null?`(对手弃牌率${pf(o.fe)})`:''}`).join('，'));
      if(A.det&&A.det.iters){const d=A.det;L.push(`胜率计算明细：模拟${d.iters}局，你赢${d.win}、平${d.tie}、输${d.lose}。`+A.live.map((j,k)=>`${P[j].name}：范围${P[j].range<1?'前'+pf(P[j].range):'任意牌'}（${(P[j].rangeWhy||[]).map(strip).join('；')||'未主动入池'}），最终赢下${pf(d.oppWin[k]/d.iters)}${d.cur?`，其范围中现在已领先你的占${pf(d.oppAhead[k]/d.iters)}`:''}`).join('；'));}
      if(A.tips&&A.tips.length) L.push('面板上显示的口诀：'+A.tips.map(t=>t[0]).join('、'));
      const pr=probRows(A); if(pr.length) L.push('面板上的概率手算过程：'+pr.map(([t,ls])=>t+'：'+ls.map(strip).join(' ')).join('｜'));
      if(!G.revealed) L.push('注意：用户处于自测模式，尚未点开教练建议。如果用户还没做决定，先引导思考，不要直接给答案，除非明确要求。');
    }
    if(G.decisions.length) L.push('本手你已做的决策：'+G.decisions.map(d=>`${STREET[d.street]} ${d.act}(${GT[d.g]}；${strip(d.note)})`).join('；'));
  }else L.push('【尚未开始任何牌局】');
  return L.join('\n');
}
const CHAT_SYS=()=>`你是用户的德州扑克私人教练，用中文回答，简洁、具体、有数字，优先讲“为什么”（位置、对手范围、底池赔率、期望值、对手风格针对策略）。基于下面的牌局信息回答，不要编造牌局里没有的信息；涉及胜率/期望值时说明是工具的近似估算。若用户的想法有道理，肯定并指出适用条件；若错了，直接指出并给出改正思路。回答控制在 250 字以内，除非用户要求展开。可用少量 **加粗** 标记关键词。用户希望练成实战直觉：合适时在结尾给一句好记的口诀或速算方法（如“半池四分一，满池三分一”“翻牌乘四，转牌乘二”）。\n\n${chatContext()}`;
function mdLite(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
function renderChat(){
  $('#chat').classList.toggle('closed',!CHAT.open);
  $('#chatTog').textContent=CHAT.open?'收起':'展开';
  const el=$('#chatMsgs'),nearBottom=el.scrollHeight-el.scrollTop-el.clientHeight<60;
  el.innerHTML=CHAT.msgs.map(m=>`<div class="m ${m.e?'e':m.role==='user'?'u':'a'}">${m.role==='user'||m.e?esc(m.content):mdLite(m.content)||`<span class="muted">${m.think?`深度思考中…（已思考 ${m.think} 字）`:'思考中…'}</span>`}</div>`).join('');
  if(nearBottom||CHAT.busy) el.scrollTop=el.scrollHeight;
  const qs=TAB==='review'&&HIST[REVIEW_SEL]?['我这手最大的失误是什么？','如果换个打法会怎样？','对手可能有什么牌？']:G.analysis&&!G.over?['为什么这样建议？','对手的范围是怎么来的？','如果我弃牌/跟注/加注会怎样？']:['这手我哪里可以改进？','对手的范围是怎么算的？'];
  $('#chatQs').innerHTML=qs.map(q=>`<button type="button">${q}</button>`).join('');
  $('#chatQs').querySelectorAll('button').forEach(b=>b.onclick=()=>askCoach(b.textContent));
  $('#chatGo').disabled=CHAT.busy;
}
async function askCoach(q){
  q=(q||'').trim(); if(!q||CHAT.busy) return;
  CHAT.open=true; CHAT.busy=true;
  const hist=CHAT.msgs.filter(m=>!m.e&&m.content).slice(-8).map(m=>({role:m.role,content:m.content}));
  CHAT.msgs.push({role:'user',content:q}); const out={role:'assistant',content:'',think:0}; CHAT.msgs.push(out); renderChat();
  const fail=t=>{const i=CHAT.msgs.indexOf(out);if(i>=0)CHAT.msgs.splice(i,1,{role:'assistant',content:t,e:true});};
  try{
    const messages=[{role:'system',content:CHAT_SYS()},...hist,{role:'user',content:q}];
    if(!OPT.dsKey&&IS_APP){fail('还没有设置 DeepSeek 密钥：点右上角 ⚙︎ → 问教练，粘贴密钥后保存。');throw 0;}
    const res=OPT.dsKey?await aiFetch(messages,true):await fetch('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(aiBody(messages,true))});
    if(!res.ok){const j=await res.json().catch(()=>({}));fail(typeof j.error==='string'?j.error:`DeepSeek 返回 ${res.status}：${(j.error&&j.error.message)||'请求失败'}${res.status===401?'（密钥无效）':res.status===402?'（账户余额不足）':''}`);}
    else{
      const rd=res.body.getReader(), dec=new TextDecoder(); let buf='';
      for(;;){
        const {done,value}=await rd.read(); if(done) break;
        buf+=dec.decode(value,{stream:true}); const lines=buf.split('\n'); buf=lines.pop();
        for(const ln of lines){
          if(!ln.startsWith('data:')) continue;
          const data=ln.slice(5).trim(); if(data==='[DONE]') continue;
          let ev; try{ev=JSON.parse(data);}catch(e){continue;}
          const dl=ev.choices&&ev.choices[0]&&ev.choices[0].delta; if(!dl) continue;
          if(dl.reasoning_content){out.think+=dl.reasoning_content.length;renderChat();}
          if(dl.content){out.content+=dl.content;renderChat();}
        }
      }
      if(!out.content&&CHAT.msgs.includes(out)) fail('没有收到回复。');
    }
  }catch(e){ if(e!==0) fail(OPT.dsKey?'连不上 DeepSeek，请检查网络：'+e.message:'无法连接本地服务（在电脑上请通过 server.py 打开页面，或在设置里填入密钥直连）：'+e.message); }
  CHAT.busy=false; LS.set('pk_chat',CHAT.msgs.filter(m=>!m.e).map(({role,content})=>({role,content})).slice(-20)); LS.set('pk_chat_open',CHAT.open); renderChat();
}
$('#chatForm').onsubmit=e=>{e.preventDefault();const v=$('#chatIn').value;$('#chatIn').value='';askCoach(v);};
$('#chatIn').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#chatForm').requestSubmit();}};
$('#chatHd').onclick=()=>{CHAT.open=!CHAT.open;LS.set('pk_chat_open',CHAT.open);renderChat();};
// 直连 DeepSeek（OpenAI 兼容格式；已确认允许 App 内跨域调用）
function aiBody(messages,stream,maxTokens){
  const pr=aiPreset();
  return {model:pr.model,messages,stream,max_tokens:maxTokens||(pr.think?4000:1200),thinking:{type:pr.think?'enabled':'disabled'}};
}
function aiFetch(messages,stream,maxTokens){
  return fetch('https://api.deepseek.com/chat/completions',{method:'POST',
    headers:{'content-type':'application/json','authorization':'Bearer '+OPT.dsKey},
    body:JSON.stringify(aiBody(messages,stream,maxTokens))});
}
async function testKey(){
  const el=$('#keyTest'); if(el) el.textContent='测试中…';
  try{
    const r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+OPT.dsKey},
      body:JSON.stringify({model:'deepseek-flash',messages:[{role:'user',content:'只回复两个字：可以'}],max_tokens:10,stream:false,thinking:{type:'disabled'}})});
    const j=await r.json().catch(()=>({}));
    if(el) el.innerHTML=r.ok?'<span class="g-good">✓ 连接成功</span>':`<span class="g-bad">✗ ${r.status} ${esc((j.error&&j.error.message)||'')}</span>`;
  }catch(e){ if(el) el.innerHTML=`<span class="g-bad">✗ 网络错误：${esc(e.message)}</span>`; }
}
function chatStatus(){
  const st=$('#chatSt'), name='DeepSeek '+aiPreset().label.split('（')[0];
  if(OPT.dsKey){st.textContent='· '+name;return;}
  if(IS_APP){st.textContent='· 未设置密钥（⚙︎ 设置）';return;}
  fetch('/api/status').then(r=>r.json()).then(j=>{st.textContent=j.hasKey?`· ${name}（本地服务）`:'· 未设置密钥（⚙︎ 设置）';}).catch(()=>{st.textContent='· 未设置密钥（⚙︎ 设置）';});
}
chatStatus();

// ================= 设置与快捷键 =================
function syncOpts(){$('#optHint').checked=OPT.hint; $('#optSpeed').value=String(OPT.speed);}
syncOpts();
$('#optHint').onchange=e=>{OPT.hint=e.target.checked;saveOpt();};
$('#optSpeed').onchange=e=>{OPT.speed=+e.target.value;saveOpt();};
// Android 返回键：整页 → 回牌桌；抽屉展开 → 收起；否则退到后台（不丢牌局）
const CapApp=plug('App');
if(CapApp) CapApp.addListener('backButton',()=>{
  if(MOBILE&&VIEW!=='table') setView('table');
  else if(MOBILE&&SHEET_OPEN){SHEET_OPEN=false;LS.set('pk_sheet',false);renderSheet();}
  else CapApp.minimizeApp();
});
applyView();
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||(e.target.tagName==='INPUT'&&e.target.type==='number')) return;
  const k=e.key.toLowerCase();
  if((k==='n'||k===' ')&&(G.over||!G.handNo)&&!G.running){e.preventDefault();playHand();return;}
  if(!heroResolve) return;
  const p=P[0], toCall=Math.min(G.cur-p.bet,p.stack);
  if(k==='f'&&toCall>0) heroAct({type:'fold'});
  else if(k==='c') heroAct({type:toCall===0?'check':'call'});
  else if(k==='r'&&$('#bR')) heroAct({type:'raise',to:G.raiseTo});
  else if(k==='h'){G.revealed=true;render();}
  else if('1234'.includes(k)&&!G.revealed){G.guess=+k-1;renderTab();}
});
render();
